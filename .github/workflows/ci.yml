name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint / format / typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm environment
        uses: ./.github/actions/setup-pnpm

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm environment
        uses: ./.github/actions/setup-pnpm

      - name: Run unit tests
        run: pnpm test

  workers:
    name: Worker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm environment
        uses: ./.github/actions/setup-pnpm

      - name: Run worker tests
        run: pnpm test:workers

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm environment
        uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm build

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm environment
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        shell: bash
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Generate E2E test env file
        shell: bash
        run: |
          cat > tests/e2e/.dev.vars <<'EOF'
          ADMIN_PASSWORD=test-admin-password
          SESSION_SECRET=test-session-secret
          LIKE_PEPPER=test-like-pepper
          DEV_LIKE_PEPPER=test-like-pepper
          TURNSTILE_SECRET_KEY=test-turnstile-secret
          SKIP_TURNSTILE=true
          SECURE_COOKIE=false
          LOGIN_MAX_ATTEMPTS=100
          LOGIN_WINDOW_MINUTES=5
          EOF

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
